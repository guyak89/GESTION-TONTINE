<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Stock</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1><i class="fas fa-boxes"></i> Gestion de Stock</h1>
            <div class="nav-buttons">
                <button class="btn btn-primary" onclick="showAddProductModal()">
                    <i class="fas fa-plus"></i> Nouveau Produit
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Tableau de bord -->
        <div class="dashboard">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-box"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalProducts">0</h3>
                    <p>Produits Total</p>
                </div>
            </div>
            <div class="stat-card warning">
                <div class="stat-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div class="stat-info">
                    <h3 id="lowStockCount">0</h3>
                    <p>Stock Faible</p>
                </div>
            </div>
            <div class="stat-card success">
                <div class="stat-icon">
                    <i class="fas fa-euro-sign"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalValue">0€</h3>
                    <p>Valeur Totale</p>
                </div>
            </div>
        </div>

        <!-- Filtres et recherche -->
        <div class="filters">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Rechercher un produit...">
            </div>
            <select id="categoryFilter">
                <option value="">Toutes les catégories</option>
            </select>
            <button class="btn btn-secondary" onclick="toggleLowStockFilter()">
                <i class="fas fa-filter"></i> Stock Faible
            </button>
        </div>

        <!-- Onglets -->
        <div class="tabs">
            <button class="tab-button active" onclick="showTab('products')">
                <i class="fas fa-list"></i> Produits
            </button>
            <button class="tab-button" onclick="showTab('movements')">
                <i class="fas fa-exchange-alt"></i> Mouvements
            </button>
        </div>

        <!-- Contenu des onglets -->
        <div class="tab-content">
            <!-- Onglet Produits -->
            <div id="products-tab" class="tab-pane active">
                <div class="table-container">
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th>Nom</th>
                                <th>Catégorie</th>
                                <th>Stock</th>
                                <th>Prix</th>
                                <th>Stock Min</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Onglet Mouvements -->
            <div id="movements-tab" class="tab-pane">
                <div class="table-container">
                    <table class="movements-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Produit</th>
                                <th>Type</th>
                                <th>Quantité</th>
                                <th>Motif</th>
                            </tr>
                        </thead>
                        <tbody id="movementsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Ajouter/Modifier Produit -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Ajouter un Produit</h2>
                <span class="close" onclick="closeModal('productModal')">&times;</span>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label for="productName">Nom du produit *</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label for="productDescription">Description</label>
                    <textarea id="productDescription" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="productCategory">Catégorie</label>
                        <input type="text" id="productCategory">
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Prix (€)</label>
                        <input type="number" id="productPrice" step="0.01" min="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="productQuantity">Quantité initiale</label>
                        <input type="number" id="productQuantity" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="productMinStock">Stock minimum</label>
                        <input type="number" id="productMinStock" min="0" value="10">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('productModal')">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Mouvement de Stock -->
    <div id="stockModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Mouvement de Stock</h2>
                <span class="close" onclick="closeModal('stockModal')">&times;</span>
            </div>
            <form id="stockForm">
                <input type="hidden" id="stockProductId">
                <div id="stockProductInfo" class="product-info"></div>
                <div class="form-group">
                    <label>Type de mouvement</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="movementType" value="in" checked>
                            <span>Entrée</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="movementType" value="out">
                            <span>Sortie</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="stockQuantity">Quantité *</label>
                    <input type="number" id="stockQuantity" min="1" required>
                </div>
                <div class="form-group">
                    <label for="stockReason">Motif</label>
                    <input type="text" id="stockReason" placeholder="Ex: Vente, Retour, Inventaire...">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('stockModal')">Annuler</button>
                    <button type="submit" class="btn btn-primary">Valider</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
